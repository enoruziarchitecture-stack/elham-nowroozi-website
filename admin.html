<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | Elham Nowroozi</title><link rel="stylesheet" href="/style.css"><style>
body{min-height:100vh}.adminWrap{max-width:1200px;margin:auto;padding:35px 5%}.adminHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#111718;color:#eee;border:1px solid #4c4039;padding:10px 16px;cursor:pointer}.tab.active,.save{background:#a96643}.panel{background:#0d1213;border:1px solid #3c3430;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{margin-bottom:13px}.field label{display:block;font-size:11px;color:#c9b6a8;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;background:#080c0d;border:1px solid #4c4039;color:#eee;padding:10px;font-family:inherit;outline:none}.field textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}.btn{border:1px solid #a96643;background:#a96643;color:#fff;padding:10px 16px;cursor:pointer;font-family:inherit}.btn.alt{background:transparent}.uploadBox{border:1px dashed #765344;padding:12px}.preview{max-width:220px;max-height:120px;object-fit:cover;margin-top:8px;border:1px solid #4c4039}.serviceRow,.subRow,.projectRow{border-bottom:1px solid #252a2b;padding:14px 0}.rowFlex{display:flex;gap:12px;align-items:center;justify-content:space-between}.mini{font-size:12px;color:#b98968}.danger{background:transparent;color:#d8896a;border:1px solid #6c4434;padding:7px 10px;cursor:pointer}.note{color:#a99d96;font-size:12px;line-height:1.8}.check{display:flex;align-items:center;gap:8px}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="header"><a class="brand" href="/"><span class="enmark">EN</span><span><b>ELHAM NOWROOZI</b><small>ARCHITECTURE STUDIO</small></span></a><nav><a href="/">بازگشت به سایت</a></nav><div class="tools">ADMIN</div></header><div class="adminWrap"><div class="adminHead"><div><div class="eyebrow">CONTENT MANAGEMENT SYSTEM</div><h1>مدیریت کامل سایت</h1></div><a class="outlineBtn" href="/">مشاهده سایت ←</a></div><div class="tabs"><button class="tab active" data-tab="site">محتوای سایت</button><button class="tab" data-tab="services">خدمات و زیرمجموعه‌ها</button><button class="tab" data-tab="projects">نمونه‌کارها</button><button class="tab" data-tab="backup">پشتیبان‌گیری</button></div><section id="site" class="tabPane"></section><section id="services" class="tabPane hidden"></section><section id="projects" class="tabPane hidden"></section><section id="backup" class="tabPane hidden"></section></div><script>
const KEY='elhamNowrooziSite_v3';const base=JSON.parse(localStorage.getItem(KEY)||'{}');
function fileToData(file,max=1800){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.type==='application/pdf'){const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>max){h=h*max/w;w=max}if(h>max){w=w*max/h;h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(base));alert('تغییرات ذخیره شد. سایت را باز یا Refresh کنید.')}catch(e){alert('ذخیره انجام نشد؛ حجم تصاویر/فایل‌های آپلودشده برای ذخیره مرورگر زیاد است. فایل‌های بزرگ را حذف یا کوچک‌تر کنید.')}}function field(label,id,val='',type='text'){return `<div class="field"><label>${label}</label><${type==='textarea'?'textarea':'input'} id="${id}">${type==='textarea'?(val||''):''}</${type==='textarea'?'textarea': 'input'}${type==='textarea'?'':' value="'+String(val||'').replace(/"/g,'&quot;')+'"'}></div>`}
function renderSite(){const h=base.hero,a=base.about,c=base.contact,f=base.footer; $('site').innerHTML=`<div class="panel"><h2>برند و منوی سایت</h2><div class="grid">${field('نام برند','brandName',base.brand.name)}${field('زیرعنوان برند','brandSub',base.brand.sub)}${field('خانه فارسی','n0fa',base.nav[0].fa)}${field('خانه انگلیسی','n0en',base.nav[0].en)}${field('خدمات فارسی','n1fa',base.nav[1].fa)}${field('خدمات انگلیسی','n1en',base.nav[1].en)}${field('درباره فارسی','n2fa',base.nav[2].fa)}${field('درباره انگلیسی','n2en',base.nav[2].en)}${field('تماس فارسی','n3fa',base.nav[3].fa)}${field('تماس انگلیسی','n3en',base.nav[3].en)}</div></div><div class="panel"><h2>هیرو</h2><div class="grid">${field('متن کوچک','he',h.eyebrow)}${field('متن کوچک انگلیسی','hee',h.enEyebrow)}${field('عنوان فارسی','ht',h.title,'textarea')}${field('عنوان انگلیسی','hte',h.enTitle,'textarea')}${field('توضیح فارسی','hd',h.desc,'textarea')}${field('توضیح انگلیسی','hde',h.enDesc,'textarea')}${field('دکمه فارسی','hb',h.button)}${field('دکمه انگلیسی','hbe',h.enButton)}<div class="field full"><label>تصویر هیرو</label><div class="uploadBox"><input type="file" id="heroFile" accept="image/*"><input id="heroImgPath" value="${h.img}"><img class="preview" id="heroPreview" src="${h.img}"></div></div></div></div><div class="panel"><h2>درباره من</h2><div class="grid">${field('عنوان کوچک','aey',a.eyebrow)}${field('تعداد/عنوان شاخص ۱','st0a',a.stats[0][0])}${field('عنوان شاخص ۱','st0b',a.stats[0][1])}${field('شاخص ۱ انگلیسی','st0c',a.stats[0][3])}${field('تعداد/عنوان شاخص ۲','st1a',a.stats[1][0])}${field('عنوان شاخص ۲','st1b',a.stats[1][1])}${field('شاخص ۲ انگلیسی','st1c',a.stats[1][3])}${field('تعداد/عنوان شاخص ۳','st2a',a.stats[2][0])}${field('عنوان شاخص ۳','st2b',a.stats[2][1])}${field('شاخص ۳ انگلیسی','st2c',a.stats[2][3])}${field('عنوان فارسی','at',a.title)}${field('عنوان انگلیسی','ate',a.enTitle)}${field('متن اول فارسی','ap1',a.p1,'textarea')}${field('متن اول انگلیسی','ape1',a.enP1,'textarea')}${field('متن دوم فارسی','ap2',a.p2,'textarea')}${field('متن دوم انگلیسی','ape2',a.enP2,'textarea')}<div class="field full"><label>تصویر درباره من</label><input type="file" id="aboutFile" accept="image/*"><input id="aboutImgPath" value="${a.img}"><img class="preview" src="${a.img}"></div>${field('امضا','sig',a.signature)}</div></div><div class="panel"><h2>تماس و فوتر</h2><div class="grid">${field('عنوان تماس فارسی','ct',c.title)}${field('عنوان تماس انگلیسی','cte',c.enTitle)}${field('توضیح تماس فارسی','cd',c.desc,'textarea')}${field('توضیح تماس انگلیسی','cde',c.enDesc,'textarea')}${field('متن دکمه فارسی','cb',c.button)}${field('متن دکمه انگلیسی','cbe',c.enButton)}${field('ایمیل','email',c.email)}${field('موقعیت','loc',f.location)}${field('تلفن','phone',f.phone)}${field('Instagram','insta',f.instagram)}${field('LinkedIn','linkedin',f.linkedin)}</div></div><button class="btn save" onclick="saveSite()">ذخیره همه تغییرات سایت</button>`;bindUpload('heroFile','heroImgPath','heroPreview',v=>base.hero.img=v);bindUpload('aboutFile','aboutImgPath',null,v=>base.about.img=v)}
function bindUpload(fileId,pathId,preview,cb){$(fileId)?.addEventListener('change',async e=>{const v=await fileToData(e.target.files[0]);if(v){$(pathId).value=v;if(preview)$(preview).src=v;cb(v)}})}
function saveSite(){const g=id=>$(id).value;base.brand.name=g('brandName');base.brand.sub=g('brandSub');[['n0fa','fa',0],['n0en','en',0],['n1fa','fa',1],['n1en','en',1],['n2fa','fa',2],['n2en','en',2],['n3fa','fa',3],['n3en','en',3]].forEach(([id,k,i])=>base.nav[i][k]=g(id));Object.assign(base.hero,{eyebrow:g('he'),enEyebrow:g('hee'),title:g('ht'),enTitle:g('hte'),desc:g('hd'),enDesc:g('hde'),button:g('hb'),enButton:g('hbe'),img:g('heroImgPath')});Object.assign(base.about,{eyebrow:g('aey'),title:g('at'),enTitle:g('ate'),p1:g('ap1'),enP1:g('ape1'),p2:g('ap2'),enP2:g('ape2'),img:g('aboutImgPath'),signature:g('sig'),stats:[[g('st0a'),g('st0b'),base.about.stats[0][2],g('st0c')],[g('st1a'),g('st1b'),base.about.stats[1][2],g('st1c')],[g('st2a'),g('st2b'),base.about.stats[2][2],g('st2c')]]});Object.assign(base.contact,{title:g('ct'),enTitle:g('cte'),desc:g('cd'),enDesc:g('cde'),button:g('cb'),enButton:g('cbe'),email:g('email')});Object.assign(base.footer,{location:g('loc'),phone:g('phone'),instagram:g('insta'),linkedin:g('linkedin'),email:g('email')});save()}
function renderServices(){let html=`<div class="panel"><h2>خدمات و زیرمجموعه‌ها</h2><p class="note">اینجا می‌توانید عنوان، توضیح، تصویر و زیرمجموعه‌های هر خدمت را تغییر دهید. برای هر زیرمجموعه نیز تصویر جداگانه می‌توانید بارگذاری کنید.</p>`;for(const [k,s] of Object.entries(base.services)){html+=`<div class="serviceRow"><div class="rowFlex"><h3>${s.title}</h3><span class="mini">${s.en}</span></div><div class="grid">${field('عنوان فارسی','s_'+k,s.title)}${field('عنوان انگلیسی','se_'+k,s.en)}${field('توضیح فارسی','sd_'+k,s.desc,'textarea')}${field('توضیح انگلیسی','sde_'+k,s.enDesc,'textarea')}<div class="field full"><label>تصویر خدمت</label><input type="file" id="sf_${k}" accept="image/*"><input id="si_${k}" value="${s.img}"><img class="preview" src="${s.img}"></div></div><h4>زیرمجموعه‌ها</h4>${s.subs.map((x,i)=>`<div class="subRow"><div class="grid">${field('عنوان فارسی','sub_'+k+'_'+i,x)}${field('عنوان انگلیسی','suben_'+k+'_'+i,s.subEn?.[i]||x)}<div class="field"><label>تصویر زیرمجموعه</label><input type="file" id="subfile_${k}_${i}" accept="image/*"><input id="subimg_${k}_${i}" value="${s.subImages?.[i]||s.img}"><img class="preview" src="${s.subImages?.[i]||s.img}"></div></div></div>`).join('')}<button class="btn" onclick="addSub('${k}')">+ افزودن زیرمجموعه</button></div>`}html+=`</div><button class="btn save" onclick="saveServices()">ذخیره خدمات و زیرمجموعه‌ها</button>`;$('services').innerHTML=html;for(const k of Object.keys(base.services)){bindUpload('sf_'+k,'si_'+k,null,v=>base.services[k].img=v);base.services[k].subImages=base.services[k].subImages||[];base.services[k].subs.forEach((_,i)=>bindUpload('subfile_'+k+'_'+i,'subimg_'+k+'_'+i,null,v=>base.services[k].subImages[i]=v))}}
function addSub(k){base.services[k].subs.push('زیرمجموعه جدید');base.services[k].subImages=base.services[k].subImages||[];base.services[k].subImages.push(base.services[k].img);base.services[k].subEn=base.services[k].subEn||[];base.services[k].subEn.push('New Subcategory');renderServices()}
function saveServices(){for(const [k,s] of Object.entries(base.services)){s.title=$('s_'+k).value;s.en=$('se_'+k).value;s.desc=$('sd_'+k).value;s.enDesc=$('sde_'+k).value;s.img=$('si_'+k).value;s.subs=s.subs.map((x,i)=>$('sub_'+k+'_'+i).value);s.subEn=s.subs.map((x,i)=>$('suben_'+k+'_'+i).value);s.subImages=s.subs.map((x,i)=>$('subimg_'+k+'_'+i).value)}save()}
function renderProjects(){let html=`<div class="panel"><h2>افزودن نمونه‌کار</h2><div class="grid"><div class="field"><label>خدمت</label><select id="ps">${Object.entries(base.services).map(([k,s])=>`<option value="${k}">${s.title}</option>`).join('')}</select></div><div class="field"><label>زیرمجموعه</label><select id="pSub"></select></div>${field('عنوان فارسی','pt')}${field('عنوان انگلیسی','pte')}${field('توضیح فارسی','pd','', 'textarea')}${field('توضیح انگلیسی','pde','', 'textarea')}<div class="field full"><label>تصویر نمونه‌کار</label><input type="file" id="pf" accept="image/*"><input id="pi" value=""><img class="preview" id="pp"></div><div class="field full"><label>فایل PDF یا فایل پروژه (اختیاری)</label><input type="file" id="pfile" accept=".pdf,.dwg,.dxf,.rvt,.zip"><input id="pfi" placeholder="بعد از انتخاب فایل، اینجا ذخیره می‌شود"></div></div><button class="btn save" onclick="addProject()">ذخیره نمونه‌کار</button></div><div class="panel"><h2>نمونه‌کارهای ثبت‌شده</h2><div id="projectList"></div></div>`;$('projects').innerHTML=html;const update=()=>{$('pSub').innerHTML=base.services[$('ps').value].subs.map(x=>`<option>${x}</option>`).join('')};$('ps').onchange=update;update();bindUpload('pf','pi','pp',()=>{});$('pfile').onchange=async e=>{const v=await fileToData(e.target.files[0]);$('pfi').value=v};renderProjectList()}
async function addProject(){const img=$('pi').value;if(!img)return alert('لطفاً تصویر نمونه‌کار را انتخاب کنید.');base.projects=base.projects||[];const project={id:Date.now(),service:String($('ps').value),sub:$('pSub').value,title:$('pt').value.trim(),enTitle:$('pte').value.trim(),desc:$('pd').value,enDesc:$('pde').value,img:img,file:$('pfi').value||''};base.projects.unshift(project);try{localStorage.setItem(KEY,JSON.stringify(base));alert('نمونه‌کار با موفقیت ذخیره شد و در سایت نمایش داده می‌شود.');renderProjects()}catch(e){base.projects.shift();alert('نمونه‌کار ذخیره نشد؛ حجم فایل‌های ذخیره‌شده در مرورگر زیاد است. تصویر/PDF کوچک‌تری انتخاب کنید.')}}
function renderProjectList(){const list=$('projectList');if(!list)return;list.innerHTML=(base.projects||[]).map(p=>`<div class="projectRow rowFlex"><div><b>${p.title}</b><div class="mini">${base.services[p.service]?.title||''} / ${p.sub}</div></div><button class="danger" onclick="delProject(${p.id})">حذف</button></div>`).join('')||'<p class="note">نمونه‌کاری ثبت نشده است.</p>'}function delProject(id){base.projects=base.projects.filter(x=>x.id!==id);save();renderProjectList()}
function renderBackup(){$('backup').innerHTML=`<div class="panel"><h2>پشتیبان‌گیری و انتقال محتوا</h2><p class="note">تمام محتوای پنل در مرورگر ذخیره می‌شود. برای انتقال به کامپیوتر دیگر، از این بخش فایل پشتیبان بگیرید.</p><button class="btn" onclick="downloadBackup()">دریافت فایل پشتیبان JSON</button><div class="field" style="margin-top:20px"><label>بازگردانی پشتیبان</label><input type="file" id="restore" accept="application/json"></div></div>`;$('restore').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);localStorage.setItem(KEY,JSON.stringify(x));location.reload()}catch{alert('فایل پشتیبان معتبر نیست')}};r.readAsText(e.target.files[0])}}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(base)],{type:'application/json'}));a.download='elham-nowroozi-site-backup.json';a.click()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabPane').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});renderSite();renderServices();renderProjects();renderBackup();
</script></body></html>
